[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/book"
  to = "https://apocalypse249.co.uk/v2/#book/location/3/count/1/provider/any/"
  status = 302
  force = true

[[redirects]]
  from = "/booking"
  to = "https://apocalypse249.co.uk/v2/#book/location/3/count/1/provider/any/"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store"
